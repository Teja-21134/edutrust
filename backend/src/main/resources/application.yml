spring:
  application:
    name: edutrust-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/edutrust}
    username: ${DB_USERNAME:edutrust}
    password: ${DB_PASSWORD:edutrust}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

app:
  ingestion:
    repeated-line-page-ratio: ${INGESTION_REPEATED_LINE_PAGE_RATIO:0.6}
  jwt:
    secret: ${JWT_SECRET:edutrust-development-secret-change-me-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  seed-users:
    admin-name: ${ADMIN_NAME:College Admin}
    admin-email: ${ADMIN_EMAIL:admin@college.edu}
    admin-password: ${ADMIN_PASSWORD:admin123}
    student-name: ${STUDENT_NAME:College Student}
    student-email: ${STUDENT_EMAIL:student@college.edu}
    student-password: ${STUDENT_PASSWORD:student123}

edutrust:
  embedding:
    model: ${EDUTRUST_EMBEDDING_MODEL:bge-small-en-v1.5}
    dimensions: 384
    batch-size: ${EDUTRUST_EMBEDDING_BATCH_SIZE:16}
  chunking:
    max-chars: ${EDUTRUST_CHUNKING_MAX_CHARS:800}
    overlap-chars: ${EDUTRUST_CHUNKING_OVERLAP_CHARS:100}
  retrieval:
    top-k: ${EDUTRUST_RETRIEVAL_TOP_K:5}
  llm:
    base-url: ${EDUTRUST_LLM_BASE_URL:http://localhost:11434}
    model: ${EDUTRUST_LLM_MODEL:llama3.2:3b}
    temperature: ${EDUTRUST_LLM_TEMPERATURE:0}
    timeout-seconds: ${EDUTRUST_LLM_TIMEOUT_SECONDS:180}
