spring:
  application:
    name: edutrust-backend
  config:
    import: optional:classpath:/institution.yml,optional:file:${INSTITUTION_CONFIG:./institution.yml}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/edutrust}
    username: ${DB_USERNAME:edutrust}
    password: ${DB_PASSWORD:edutrust}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

app:
  ingestion:
    repeated-line-page-ratio: ${INGESTION_REPEATED_LINE_PAGE_RATIO:0.6}
    pdf:
      spacing-tolerance: ${INGESTION_PDF_SPACING_TOLERANCE:0.25}
      average-char-tolerance: ${INGESTION_PDF_AVERAGE_CHAR_TOLERANCE:0.25}
      column-gap-points: ${INGESTION_PDF_COLUMN_GAP_POINTS:8}
      line-y-tolerance-points: ${INGESTION_PDF_LINE_Y_TOLERANCE_POINTS:2.5}
      header-footer-margin-mm: ${INGESTION_PDF_HEADER_FOOTER_MARGIN_MM:20}
  jwt:
    secret: ${JWT_SECRET:edutrust-development-secret-change-me-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  seed-users:
    admin-name: ${ADMIN_NAME:College Admin}
    admin-email: ${ADMIN_EMAIL:admin@college.edu}
    admin-password: ${ADMIN_PASSWORD:admin123}
    student-name: ${STUDENT_NAME:College Student}
    student-email: ${STUDENT_EMAIL:student@college.edu}
    student-password: ${STUDENT_PASSWORD:student123}

edutrust:
  pipeline:
    default-version: ${EDUTRUST_PIPELINE_DEFAULT_VERSION:v1}
  cors:
    allowed-origins: ${EDUTRUST_CORS_ALLOWED_ORIGINS:http://localhost:8443,http://localhost:5173,http://127.0.0.1:8443,http://127.0.0.1:5173}
  embedding:
    model: ${EDUTRUST_EMBEDDING_MODEL:bge-small-en-v1.5}
    dimensions: 384
    batch-size: ${EDUTRUST_EMBEDDING_BATCH_SIZE:16}
  chunking:
    max-chars: ${EDUTRUST_CHUNKING_MAX_CHARS:800}
    overlap-chars: ${EDUTRUST_CHUNKING_OVERLAP_CHARS:100}
    target-min-chars: ${EDUTRUST_CHUNKING_TARGET_MIN_CHARS:300}
    target-max-chars: ${EDUTRUST_CHUNKING_TARGET_MAX_CHARS:500}
  retrieval:
    top-k: ${EDUTRUST_RETRIEVAL_TOP_K:5}
    vector-candidate-k: ${EDUTRUST_RETRIEVAL_VECTOR_CANDIDATE_K:20}
    fts-candidate-k: ${EDUTRUST_RETRIEVAL_FTS_CANDIDATE_K:20}
    rrf-k: ${EDUTRUST_RETRIEVAL_RRF_K:60}
  llm:
    base-url: ${EDUTRUST_LLM_BASE_URL:http://localhost:11434}
    model: ${EDUTRUST_LLM_MODEL:llama3.2:3b}
    temperature: ${EDUTRUST_LLM_TEMPERATURE:0}
    timeout-seconds: ${EDUTRUST_LLM_TIMEOUT_SECONDS:180}
  verification:
    minimum-score: ${EDUTRUST_VERIFICATION_MINIMUM_SCORE:0.55}
