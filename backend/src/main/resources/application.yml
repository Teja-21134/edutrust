spring:
  application:
    name: edutrust-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/edutrust}
    username: ${DB_USERNAME:edutrust}
    password: ${DB_PASSWORD:edutrust}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  ingestion:
    repeated-line-page-ratio: ${INGESTION_REPEATED_LINE_PAGE_RATIO:0.6}
  jwt:
    secret: ${JWT_SECRET:edutrust-development-secret-change-me-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  seed-users:
    admin-name: ${ADMIN_NAME:College Admin}
    admin-email: ${ADMIN_EMAIL:admin@college.edu}
    admin-password: ${ADMIN_PASSWORD:admin123}
    student-name: ${STUDENT_NAME:College Student}
    student-email: ${STUDENT_EMAIL:student@college.edu}
    student-password: ${STUDENT_PASSWORD:student123}
